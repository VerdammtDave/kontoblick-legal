# Hält das Feedback-Projekt wach: Der kostenlose Supabase-Tarif pausiert Projekte nach etwa einer Woche ohne Aktivität.
# Ruft alle drei Tage eine harmlose Abfrage auf. Damit GitHub diesen Zeitplan nicht nach 60 Tagen ohne Repo-Aktivität
# abschaltet, macht der Lauf bei Bedarf alle 30 Tage einen leeren Commit.
name: Keep feedback backend awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping
        run: |
          curl -fsS -X POST "https://jgadfqdxyosbgsomoepk.supabase.co/rest/v1/rpc/device_allowed" \
            -H "apikey: sb_publishable_zTdMy5aGsxn2jxy1v9TOdg_ZL5HZXqJ" \
            -H "Content-Type: application/json" \
            -d '{"p_device":"00000000-0000-0000-0000-000000000000"}'
      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 2592000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keepalive"
            git push
          fi
